name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/*.whl dist/*.tar.gz release/
          cp sample.config.json release/config.json
          cp README.md release/
          tar -czf "moocpy_${GITHUB_REF_NAME}_source.tar.gz" moocpy view tests \
            requirements.txt requirements-dev.txt pyproject.toml README.md sample.config.json
          mv "moocpy_${GITHUB_REF_NAME}_source.tar.gz" release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
